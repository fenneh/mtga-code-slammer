name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 scripts/check-codes.py
